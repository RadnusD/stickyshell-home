<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="stickyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff677"/>
      <stop offset="100%" stop-color="#f5c71a"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4a3f00" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Sticky Note with neat corners -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#stickyGrad)" stroke="#deb008" stroke-width="2" filter="url(#dropShadow)"/>
  
  <!-- Subtle Top Reflection Accent -->
  <path d="M 36 15 Q 64 17 92 15" stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Terminal Prompt >_ -->
  <path d="M 44 48 L 62 64 L 44 80" fill="none" stroke="#262104" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="72" y1="80" x2="86" y2="80" stroke="#262104" stroke-width="8.5" stroke-linecap="round"/>
</svg>