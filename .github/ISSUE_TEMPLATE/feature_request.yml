name: Feature Request
description: Suggest an enhancement or new capability for StickyShell
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose new features or improvements to existing functionality.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Describe the specific workflow limitation or problem this solves.
      placeholder: "When working with..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision the feature working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you considered.
