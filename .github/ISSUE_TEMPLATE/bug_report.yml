name: 🐞 Bug Report
description: Report an issue or unexpected behavior in StickyShell Home
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us investigate and resolve it quickly.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What platform are you running StickyShell on?
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - macOS (Apple Silicon - M1/M2/M3)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Linux (Fedora / RedHat)
        - Linux (Arch / Other)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StickyShell Version
      placeholder: e.g. 1.0.0
      value: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Description of the Problem
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open note
        2. Type command '...'
        3. Press Ctrl+Enter
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: System Diagnostics
      description: Copy & paste the diagnostics from Settings -> About -> 'Copy Diagnostics' button.
      render: markdown
