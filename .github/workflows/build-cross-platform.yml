name: Cross-Platform Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            rust_targets: 'x86_64-apple-darwin,aarch64-apple-darwin'
            args: '--target universal-apple-darwin'
            bundle_path: 'src-tauri/target/universal-apple-darwin/release/bundle/'
          - platform: 'ubuntu-22.04'
            rust_targets: 'x86_64-unknown-linux-gnu'
            args: ''
            bundle_path: 'src-tauri/target/release/bundle/'
          - platform: 'windows-latest'
            rust_targets: 'x86_64-pc-windows-msvc'
            args: ''
            bundle_path: 'src-tauri/target/release/bundle/'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri Bundles
        run: npx @tauri-apps/cli build ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stickyshell-${{ matrix.platform }}
          path: |
            ${{ matrix.bundle_path }}
            src-tauri/target/release/bundle/
          if-no-files-found: warn

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release to Public Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: RadnusD/stickyshell-home
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('StickyShell Home {0}', github.ref_name) || 'StickyShell Home v1.0.0' }}
          body: 'StickyShell Home official release for Windows, Linux, and macOS.'
          draft: true
          prerelease: false
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*universal.app.tar.gz

